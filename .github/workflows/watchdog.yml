name: Refresh watchdog

# A second, independent heartbeat for the data pipeline.
#
# The refresh cadence is a timer, every 4 hours (data/cadence.json; every
# run arms timer.yml for one period after its start, and the timer
# dispatches the next run; before 2026-09-30 it was a self-chain of
# 20-minute runs). It is not a cron: GitHub fired this repository's
# schedules 5-8 times a day with gaps of 2-6.5 h over 12-28 September, so
# a cron cannot hold the period -- this workflow's own cron included, which
# is why it acts as a backstop and never as the clock. A timer can still be
# lost (a runner reclaimed, an arm that failed), and then the cadence
# stops. Worse, a deterministic failure
# (an OOM, a code fault) makes every run fail the same way, so the site can
# sit stale indefinitely with every run either red or absent. And a run can
# be GREEN while collection is dead: for five days in August every summary
# failed to parse, was journaled as done, and the export republished the same
# rows -- nothing in the system noticed; the owner did.
#
# This workflow watches OUTCOMES, not runs:
#   0. the clock  -- is a timer sleeping (a timer.yml run queued or in
#                   progress)? If none is, and no refresh is running, arm one
#                   for the last success's start plus a period (EVERY_HOURS,
#                   pinned to data/cadence.json by scripts/test_cadence.py) --
#                   a slot already past fires at once, and the timer itself
#                   stands down if a refresh turns out to be running or fresh.
#   1. liveness  -- has a refresh SUCCEEDED within one cadence period plus an
#                   hour (STALE_SUCCESS_MIN = every_hours x 60 + 60, pinned
#                   likewise)? If not and nothing is queued or running,
#                   dispatch one. A healthy cadence never trips this, so the
#                   watchdog never adds a run -- and the spend -- to a cadence
#                   that is working. The revived run is an ordinary cadence
#                   run: it dispatches no successor (refresh.yml's Chain
#                   step) and arms the next timer from its own start.
#   2. recency   -- does the published site's build_health.txt say the newest
#                   collected run is recent? A build that keeps landing while
#                   newest_row stops advancing is the silent-outage signature.
#   3. alerting  -- when either check fails hard, open (or update) a GitHub
#                   issue titled "Refresh stalled" so a human is told, and
#                   close it automatically once things are healthy again.
#
# It runs on a cron, so its ticks are hours apart and irregular -- but the
# timer and the cron are independent clocks, far less likely to both stall,
# and every tick that does fire takes a full corrective action rather than
# a single attempt that can itself fail.

# Resumed with the refresh (owner, 2026-09-30: the 4-hour cadence). It was
# paused with it on 2026-09-28 (cron commented out, `if: false` on the job),
# because its whole purpose is to re-dispatch a refresh that has gone quiet;
# pause it the same way again whenever the refresh is paused, or it will
# revive what the owner stopped. Hourly is plenty for a 4-hour cadence:
# every tick takes a full corrective action, and the thresholds below are
# what keep it from acting on a cadence that is merely between runs.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: wowlogs-watchdog
  cancel-in-progress: false

env:
  # thresholds, in minutes. The first four follow the cadence period
  # (data/cadence.json every_hours = 4, pinned by scripts/test_cadence.py):
  # a healthy cadence has a success at most ~4.5 h old (a period plus a
  # run's length) and data a little older than that.
  EVERY_HOURS: 4             # data/cadence.json every_hours: the slot a re-armed timer is set to
  STALE_SUCCESS_MIN: 300     # every_hours x 60 + 60: no successful refresh for this long -> dispatch
  ALERT_SUCCESS_MIN: 540     # two periods + 1 h without a success -> also open the issue
  STALE_DATA_MIN: 600        # newest collected run older than this (2.5 periods) -> issue
  STUCK_QUEUE_MIN: 45        # queued/pending this long with NOTHING running -> cancel it
  MIN_ROWS: 200000           # published rows below this -> issue (retention steady state ~800k)
  EXPECT_RESETS: 2           # policy: the build ships the newest two resets (scripts/retention.py)
  BRANCH: claude/wow-mythic-dashboard-jv235l
  SITE_HEALTH: https://st331.github.io/wowlogs/build_health.txt

jobs:
  watch:
    # to pause with the refresh: `if: false` here and the cron commented out above
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the refresh workflow and the published site
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          api() { curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          NOW=$(date -u +%s)

          # ---- 1. refresh runs: latest success age, anything active, failure streak
          RUNS=$(api "https://api.github.com/repos/$REPO/actions/workflows/refresh.yml/runs?branch=$BRANCH&per_page=25") || RUNS='{"workflow_runs":[]}'
          LAST_OK=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion=="success")] | sort_by(.updated_at) | last | .updated_at // empty')
          # the last success's START, the slot a re-armed timer counts from
          LAST_OK_START=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion=="success")] | sort_by(.updated_at) | last | .run_started_at // .created_at // empty')
          # ---- 0. the clock: a timer.yml run sleeping (queued or in progress)?
          TIMERS=$(api "https://api.github.com/repos/$REPO/actions/workflows/timer.yml/runs?branch=$BRANCH&per_page=10") || TIMERS='{"workflow_runs":[]}'
          TIMER_PENDING=$(echo "$TIMERS" | jq -r '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length')
          if [ -n "$LAST_OK_START" ]; then
            NEXT_DUE=$(( $(date -u -d "$LAST_OK_START" +%s) + EVERY_HOURS * 3600 ))
          else
            NEXT_DUE=$NOW
          fi
          RUNS_OK_AGE=$OK_AGE
          # A run that is RUNNING is active. A run that is merely waiting for a
          # runner is not -- and treating it as active is how this workflow sat
          # and watched the pipeline die for 68 hours.
          #
          # 2026-09-03T10:33Z a self-chained workflow_dispatch went to "queued"
          # and never got a runner. concurrency wowlogs-refresh has
          # cancel-in-progress:false, so it held the group; every scheduled run
          # after it went "pending" and was cancelled by the next one arriving.
          # 22 consecutive cancelled runs, data frozen for 2.8 days. This step
          # counted that stuck run as ACTIVE on every tick, so the revive step
          # was SKIPPED every time. The alert fired correctly and was ignored
          # -- an alarm nobody is awake for is not a recovery mechanism.
          #
          # So: waiting runs count as active only while something is actually
          # running (a legitimate queue behind a 110-minute drain), or while
          # they are young. Older than STUCK_QUEUE_MIN with nothing running is
          # a stuck run, and the next step cancels it to free the group.
          RUNNING=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.status=="in_progress")] | length')
          WAITING=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length')
          STUCK_ID=""; STUCK_AGE=0
          if [ "$RUNNING" = "0" ] && [ "$WAITING" != "0" ]; then
            # `empty` for "none", never a placeholder pair: a sentinel like
            # " 0" reads back through `read` as the id 0 and this workflow
            # would then POST a cancel for run 0 on every quiet tick.
            STUCK_LINE=$(echo "$RUNS" | jq -r --argjson now "$NOW" --argjson lim "$STUCK_QUEUE_MIN" '
              [.workflow_runs[]
               | select(.status=="queued" or .status=="pending" or .status=="waiting")
               | {id, age: (($now - (.created_at | fromdateiso8601)) / 60 | floor)}
               | select(.age > $lim)]
              | sort_by(-.age) | first | if . then "\(.id) \(.age)" else empty end')
            if [ -n "$STUCK_LINE" ]; then read -r STUCK_ID STUCK_AGE <<<"$STUCK_LINE"; fi
          fi
          ACTIVE=$(( RUNNING + WAITING ))
          [ -n "$STUCK_ID" ] && ACTIVE=$(( ACTIVE - 1 ))
          # consecutive non-success conclusions among completed runs, newest first
          STREAK=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.status=="completed")] | sort_by(.created_at) | reverse | [.[].conclusion] | (index("success") // length)')
          LAST_CONCLUSION=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.status=="completed")] | sort_by(.created_at) | last | .conclusion // "none"')
          if [ -n "$LAST_OK" ]; then
            OK_AGE=$(( (NOW - $(date -u -d "$LAST_OK" +%s)) / 60 ))
          else
            OK_AGE=99999
          fi

          # ---- 2. the published site's own account of itself
          HEALTH=$(curl -sf -m 30 "$SITE_HEALTH" || true)
          BUILT=$(echo "$HEALTH" | sed -n 's/^\[season\] built=//p;s/^built=//p' | head -1)
          NEWEST=$(echo "$HEALTH" | sed -n 's/^\[season\] newest_row=//p;s/^newest_row=//p' | head -1)
          ROWS=$(echo "$HEALTH" | sed -n 's/^\[season\] rows=//p;s/^rows=//p' | head -1)
          RESETS=$(echo "$HEALTH" | sed -n 's/^retention.resets=//p' | head -1)
          STALE_WIN=$(echo "$HEALTH" | sed -n 's/^retention.stale=//p' | head -1)
          case "$ROWS" in ''|*[!0-9]*) ROWS_N=-1 ;; *) ROWS_N="$ROWS" ;; esac
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "none" ]; then
            DATA_AGE=$(( (NOW - $(date -u -d "$NEWEST" +%s)) / 60 ))
          else
            DATA_AGE=-1      # health file predates the field; recency unknown
          fi
          # The site's build stamp is a SECOND WITNESS to liveness: only a
          # refresh run builds and publishes it (the UI-only deploy carries
          # the file over unchanged). 2026-09-30 13:00Z the runs list came
          # back ten days stale -- newest success 2026-09-19, while the site
          # said built 10:40Z that day -- and this workflow dispatched a run
          # on it and opened the alert. So the age that drives the revival
          # and the alert is the younger of the two witnesses; a list older
          # than the site is said so and its failure streak is not believed,
          # and the next slot is counted from the site's build (a run starts
          # ~10 min before it publishes).
          if [ -n "$BUILT" ]; then
            BUILT_S=$(date -u -d "$BUILT" +%s 2>/dev/null || echo "")
          else
            BUILT_S=""
          fi
          # (30 min of tolerance: a run's own end is minutes after its build)
          if [ -n "$BUILT_S" ] && [ $(( (NOW - BUILT_S) / 60 + 30 )) -lt "$OK_AGE" ]; then
            BUILT_AGE=$(( (NOW - BUILT_S) / 60 ))
            if [ "$OK_AGE" -ne 99999 ]; then
              echo "::warning::the runs list is stale: its newest success is ${OK_AGE} min old but the site was built ${BUILT_AGE} min ago; trusting the site"
            fi
            OK_AGE=$BUILT_AGE
            STREAK=0
            LAST_CONCLUSION="success (per the site's build stamp)"
            NEXT_DUE=$(( BUILT_S - 600 + EVERY_HOURS * 3600 ))
          fi

          echo "last successful refresh : ${LAST_OK:-never} (${RUNS_OK_AGE} min ago per the runs list; ${OK_AGE} min counting the site's build)"
          echo "timers sleeping         : $TIMER_PENDING (next slot $(date -u -d "@$NEXT_DUE" +'%H:%M UTC'))"
          echo "active refresh runs     : $ACTIVE (running $RUNNING, waiting $WAITING)"
          [ -n "$STUCK_ID" ] && echo "STUCK queued run        : #$STUCK_ID, ${STUCK_AGE} min with nothing running"
          echo "failure streak          : $STREAK (last: $LAST_CONCLUSION)"
          echo "site built              : ${BUILT:-unknown}  rows=${ROWS:-?}"
          echo "newest collected run    : ${NEWEST:-unknown} (data age ${DATA_AGE} min)"
          {
            echo "ok_age=$OK_AGE"; echo "active=$ACTIVE"; echo "streak=$STREAK"
            echo "timer_pending=$TIMER_PENDING"; echo "next_due=$NEXT_DUE"
            echo "stuck_id=$STUCK_ID"; echo "stuck_age=$STUCK_AGE"
            echo "last_conclusion=$LAST_CONCLUSION"; echo "data_age=$DATA_AGE"
            echo "built=${BUILT:-unknown}"; echo "newest=${NEWEST:-unknown}"; echo "rows=${ROWS:-?}"
            echo "rows_n=$ROWS_N"; echo "resets=${RESETS:-}"; echo "stale_win=${STALE_WIN:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Free the concurrency group from a run that never got a runner
        # Cancelling is the ONLY way to release a stuck run's concurrency slot;
        # there is no API to evict one. The run has done no work -- it never
        # started -- so nothing is lost, and the revive step below immediately
        # dispatches a replacement.
        if: steps.probe.outputs.stuck_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "cancelling #${{ steps.probe.outputs.stuck_id }}, queued ${{ steps.probe.outputs.stuck_age }} min with nothing running"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/${{ steps.probe.outputs.stuck_id }}/cancel" \
            && echo "cancelled" || echo "::warning::cancel failed"
          sleep 10   # let the group actually release before the dispatch below

      - name: Revive the cadence if it has stopped
        # Two triggers: the cadence has gone quiet (no success for
        # STALE_SUCCESS_MIN, one period plus an hour), OR the last runs failed
        # and nothing is queued -- a short streak (<= 3) is retried right
        # away, because a failed run is otherwise a whole period of stale
        # data (the old 75-minute rule alone let two three-minute failures
        # leave the site stale for hours). Past three failures the fault is
        # deterministic: the issue is open, and only the quiet rule keeps
        # probing (once per tick, never a tight loop). The retry runs under
        # the same 70 % cap as the run it replaces, against the account's
        # live spend, so a retry never doubles the hour's spend.
        if: steps.probe.outputs.active == '0' && (steps.probe.outputs.stuck_id != '' || fromJSON(steps.probe.outputs.ok_age) > fromJSON(env.STALE_SUCCESS_MIN) || (fromJSON(steps.probe.outputs.streak) >= 1 && fromJSON(steps.probe.outputs.streak) <= 3))
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "reviving: last success ${{ steps.probe.outputs.ok_age }} min ago, failure streak ${{ steps.probe.outputs.streak }}, nothing running -> dispatching"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/refresh.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\",\"inputs\":{\"chain\":\"true\"}}" \
            && echo "dispatched" || echo "::warning::dispatch failed"

      # The clock itself: no timer sleeping, no refresh running, the cadence
      # not (yet) stale -> arm a timer for the last success's start plus a
      # period. A slot already past fires at once; the timer stands down by
      # itself if a refresh turns out to be running or fresh. When the
      # cadence IS stale the revive step above has dispatched a run, and that
      # run arms the next timer from its own start.
      - name: Arm the timer when none is sleeping
        if: steps.probe.outputs.timer_pending == '0' && steps.probe.outputs.active == '0' && steps.probe.outputs.stuck_id == '' && fromJSON(steps.probe.outputs.ok_age) <= fromJSON(env.STALE_SUCCESS_MIN)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEXT_DUE: ${{ steps.probe.outputs.next_due }}
        run: |
          echo "no timer is sleeping: arming one for $(date -u -d "@$NEXT_DUE" +'%Y-%m-%d %H:%M UTC') ($(TZ=Asia/Kolkata date -d "@$NEXT_DUE" +'%H:%M IST'))"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/timer.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\",\"inputs\":{\"fire_at\":\"$NEXT_DUE\",\"armed_by\":\"watchdog #${{ github.run_number }}\"}}" \
            && echo "armed" || echo "::warning::arming the timer failed"

      - name: Raise or clear the alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OK_AGE: ${{ steps.probe.outputs.ok_age }}
          STREAK: ${{ steps.probe.outputs.streak }}
          STUCK_ID: ${{ steps.probe.outputs.stuck_id }}
          STUCK_AGE: ${{ steps.probe.outputs.stuck_age }}
          DATA_AGE: ${{ steps.probe.outputs.data_age }}
          BUILT: ${{ steps.probe.outputs.built }}
          NEWEST: ${{ steps.probe.outputs.newest }}
          ROWS: ${{ steps.probe.outputs.rows }}
          ROWS_N: ${{ steps.probe.outputs.rows_n }}
          RESETS: ${{ steps.probe.outputs.resets }}
          STALE_WIN: ${{ steps.probe.outputs.stale_win }}
          LAST_CONCLUSION: ${{ steps.probe.outputs.last_conclusion }}
        run: |
          set -u
          api() { curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          TITLE="Refresh stalled"
          NL=$'\n'
          REASONS=""
          [ "$OK_AGE" -gt "$ALERT_SUCCESS_MIN" ] && REASONS="${REASONS}${NL}- no successful refresh for **${OK_AGE} min** (last run: ${LAST_CONCLUSION})"
          [ "$STREAK" -ge 2 ] && REASONS="${REASONS}${NL}- **${STREAK} consecutive failed runs** -- a deterministic fault, not a blip; the dead-man cron cannot fix this"
          [ -n "$STUCK_ID" ] && REASONS="${REASONS}${NL}- run [#${STUCK_ID}](https://github.com/${REPO}/actions/runs/${STUCK_ID}) sat **${STUCK_AGE} min** waiting for a runner with nothing running, holding the \`wowlogs-refresh\` concurrency group so every later run queued behind it and was cancelled; this watchdog has cancelled it"
          [ "$DATA_AGE" -gt "$STALE_DATA_MIN" ] && REASONS="${REASONS}${NL}- site keeps building (built ${BUILT}, ${ROWS} rows) but the **newest collected run is ${DATA_AGE} min old** -- collection is dead while runs are green"
          # retention guard rails (2026-09-14): far too few published rows, a window other than
          # the policy's, or a page flagged STALE (newest run held older than the ceiling)
          [ "${ROWS_N:--1}" -ge 0 ] 2>/dev/null && [ "${ROWS_N:-0}" -lt "$MIN_ROWS" ] 2>/dev/null && REASONS="${REASONS}${NL}- the build published **${ROWS_N} rows** (floor ${MIN_ROWS}) -- the journals or the CSV have been emptied; check the prune (data/processed/prune_state.json) before the daily seed overwrites \`data/mythic_runs.csv.gz\`"
          [ -n "${RESETS:-}" ] && [ "$RESETS" != "$EXPECT_RESETS" ] && REASONS="${REASONS}${NL}- the build ships **${RESETS} resets**, policy is ${EXPECT_RESETS} (scripts/retention.py)"
          [ "${STALE_WIN:-0}" = "1" ] && REASONS="${REASONS}${NL}- the page is **STALE**: the newest run held is older than the retention ceiling; it shows the newest two resets on file and says so"

          OPEN=$(api "https://api.github.com/repos/$REPO/issues?state=open&labels=watchdog&per_page=5" | jq -r '[.[] | select(.title=="'"$TITLE"'")] | first | .number // empty')

          if [ -n "$REASONS" ]; then
            BODY="The refresh watchdog found the pipeline unhealthy at $(date -u +'%Y-%m-%d %H:%M UTC')."
            BODY="${BODY}${NL}${REASONS}${NL}"
            BODY="${BODY}${NL}Where to look: the latest runs of [Refresh Season 2 data](https://github.com/$REPO/actions/workflows/refresh.yml), and the published [build_health.txt](${SITE_HEALTH}), whose fetch.* lines carry the last run's fetch counters (released / to go / outcome / backlog)."
            BODY="${BODY}${NL}${NL}This issue closes itself when a refresh succeeds and the data is moving again."
            PAYLOAD=$(jq -n --arg t "$TITLE" --arg b "$BODY" '{title:$t, body:$b, labels:["watchdog"]}')
            if [ -z "$OPEN" ]; then
              api -X POST "https://api.github.com/repos/$REPO/issues" -d "$PAYLOAD" >/dev/null && echo "opened issue: $TITLE"
            else
              api -X POST "https://api.github.com/repos/$REPO/issues/$OPEN/comments" \
                -d "$(jq -n --arg b "$BODY" '{body:$b}')" >/dev/null && echo "updated issue #$OPEN"
            fi
            echo "::error::$TITLE --$REASONS"
          else
            echo "healthy: last success ${OK_AGE} min ago, data age ${DATA_AGE} min, streak ${STREAK}"
            if [ -n "$OPEN" ]; then
              api -X POST "https://api.github.com/repos/$REPO/issues/$OPEN/comments" \
                -d "$(jq -n --arg b "Healthy again at $(date -u +'%Y-%m-%d %H:%M UTC'): last successful refresh ${OK_AGE} min ago, newest collected run ${DATA_AGE} min old, ${ROWS} rows." '{body:$b}')" >/dev/null
              api -X PATCH "https://api.github.com/repos/$REPO/issues/$OPEN" -d '{"state":"closed","state_reason":"completed"}' >/dev/null && echo "closed issue #$OPEN"
            fi
          fi
