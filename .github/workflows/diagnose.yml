name: Diagnose (read-only journal scan)

# One-off diagnostics that need the collection journals, which live only in
# the Actions cache. Restores that cache READ-ONLY (never saves it back),
# runs the named script, and prints its report to the job log. Its own
# concurrency group, so it can never queue behind or cancel a refresh run.
#
# RETENTION (2026-09-14): the journals restored here hold ONLY the retention
# window (16 days from the newest row; scripts/prune_journals.py, state in
# data/processed/prune_state.json and retention.txt). A diagnostic asking a
# whole-SEASON question gets a windowed answer and says nothing about it;
# data/mythic_runs.csv.gz in the checkout is windowed too. Read the span the
# run prints before concluding anything about coverage.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "scripts/<name>.py to run against the restored journals"
        type: string
        default: "diag_tier_pairs"

permissions:
  contents: read

concurrency:
  group: wowlogs-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy
      # These paths must stay byte-identical to refresh.yml's restore and save
      # steps: actions/cache derives a cache VERSION from the path list and only
      # matches entries of the same version, so editing this list does not
      # orphan production caches (this workflow never saves) -- it silently
      # stops matching them, the restore comes back EMPTY, and the diagnostic
      # below prints a zero that reads like a finding. Never add a save step.
      - name: Restore collection journals (read-only)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/processed
          key: wowlogs-diagnose-never-matches
          restore-keys: wowlogs-journals-
      - name: Run the diagnostic
        # WCL credentials are passed so a diagnostic MAY make a request or two
        # against the live API (diag_raw_gear needs three Summary tables).
        # The client's default 0.85 ceiling applies; nothing here overrides it.
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          ls -la data/processed/gear.jsonl 2>/dev/null || echo "no gear journal restored"
          [ -f data/processed/retention.txt ] && sed 's/^/retention: /' data/processed/retention.txt || echo "retention: no prune state restored (the journals may still hold the whole season)"
          python -u "scripts/${{ inputs.script }}.py"
