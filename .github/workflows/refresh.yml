name: Refresh Season 2 data

# Collection sidecar, every 4 hours (data/cadence.json). Sweeps the Warcraft
# Logs leaderboards, fetches the summaries and the execution bundle for
# whatever is new, runs the trinket and keystone collectors in the background
# of the build, rebuilds the dashboard and the vetting-site sidecars and
# publishes them.
#
# CADENCE AND CAP (owner, 2026-09-30, after the bundle backfill: "move to a
# cadence of updating the data every 4 hours or so ... never end up using
# more than 70% of my API quota"). Both knobs live in data/cadence.json
# (scripts/cadence.py) and this workflow reads them in the Cadence step:
#   * every_hours -> the cron below, `0 */4 * * *` UTC (05:30, 09:30, 13:30,
#     17:30, 21:30, 01:30 IST). The hourly quota window resets at :00 UTC,
#     so a scheduled run starts on a fresh window. The cron IS the cadence:
#     a scheduled run dispatches no successor (the Chain step chains only
#     while data/backfill.json is in force, or an explicitly dispatched
#     drain still has a backlog); the watchdog revives a dropped tick after
#     every_hours + 1 h. scripts/test_cadence.py pins the cron and the
#     watchdog threshold to the file, so changing the period is: edit the
#     file, the cron and watchdog.yml's STALE_SUCCESS_MIN, run the test.
#   * quota_fraction -> WCL_QUOTA_FRACTION in every step that runs a client
#     (Fetch, the background collectors), and the client reads the file
#     itself when the variable is absent. The governor measures the ceiling
#     against the ACCOUNT's live spend, so the sweep, the bundle, the
#     collectors and the owner's own lookups from the vetting site together
#     never pass 70 % of the limit (12,600 of 18,000). A run that starts
#     with the hour already over it sleeps within its cap or stops cleanly.
# A scheduled run spends roughly: a deep sweep ~2,000 points (every run is
# deep at this period), ~4 hours of new runs' summaries with the bundle
# where the gate admits (~1,700 runs, ~5,000-8,000 points), then the trinket
# collector up to 1,500 and the keystone top-up ~400 -- ~9,000-12,000 in the
# hour it starts, capped at 12,600 by the governor whatever the sum comes to.
# The 2026-09-28 pause (cron commented out, `if: false` here and on the
# watchdog) is lifted by this cadence, on the owner's word above.
#
# Nothing is committed on the periodic path: the built site is 29 MB and
# committing each build would add gigabytes a month to the repository. The
# site is published straight from the run as a Pages artifact instead, and the
# journals that make the sweep incremental live in the Actions cache.
# The CSV export IS committed once a day, so a cache eviction costs at most a
# day of re-fetching rather than the whole season (see seed_from_csv()).
on:
  schedule:
    # data/cadence.json every_hours=4 -- change the two together
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      resweep:
        description: "Re-scan the leaderboards (off = only fetch known-missing summaries)"
        type: boolean
        default: true
      regear_min_key:
        description: "Refetch already-fetched runs at this key level or higher to capture gear (blank = off)"
        type: string
        default: ""
      regear_days:
        description: "How far back the gear refetch reaches, in days"
        type: string
        default: "3"
      commit_export:
        description: "Commit the data export now, gear journal included, ignoring the daily/weekly slots"
        type: boolean
        default: false
      quota_fraction:
        description: "Share of the hourly API budget this run may spend. Blank = the standing cap in data/cadence.json (0.70, owner 2026-09-30); set it only for a deliberate one-off, never to exceed what the owner allowed."
        type: string
        default: ""
      chain:
        description: "Internal: set by the previous run's self-chain dispatch"
        type: string
        default: ""
      prev_start:
        description: "Internal: predecessor run's start epoch, for 20-minute pacing"
        type: string
        default: ""
      fresh_start:
        description: "Proceed with NO restored journals (first run of a season, or after a deliberate cache reset). Otherwise a run whose restore comes back empty skips everything and keeps the newest good cache."
        type: boolean
        default: false
      # DRAIN MODE -- the owner's sanctioned relaxation of the standing cap, for one
      # operation: "remove the cap and get the site updated asap" (2026-09-02,
      # after the five-day collection outage left ~57k runs to refetch). A
      # drain run spends the WHOLE hourly account budget, stops cleanly at the
      # ceiling, exports, builds and deploys, then chains a successor timed to
      # the quota window's reset. Each successor re-reads the backlog and
      # keeps draining only while it is real; the moment it is gone the chain
      # ends and the cron cadence carries on under the standing cap. The
      # scheduled path never sets this, so the standing cap stands. The
      # ONE dispatch path that ignores data/cadence.json's cap; never
      # scheduled, never chained into from a cadence run.
      drain:
        description: "One-off: spend the full hourly budget per run and chain at the window reset until the backlog is gone, then revert to the standing-cap cadence"
        type: string
        default: ""
      prev_reset_at:
        description: "Internal: epoch when the predecessor's quota window resets; a drain successor waits for it"
        type: string
        default: ""
      # While a backlog is being drained, runs ALTERNATE so the present never
      # waits behind the past (owner: "prioritize getting new runs first";
      # "minimize the time to seeing fresh runs -- now and over the day"):
      #   fresh    -- full budget, but only runs from the last 12 hours; small,
      #               so it fetches in a minute or two and deploys straight
      #               away. Never waits for a quota window.
      #   backfill -- the rest, newest first, capped at the standing cap
      #               (data/cadence.json) so the fresh run that follows in
      #               the same window always has points left to spend.
      # Empty = the ordinary run: everything pending, newest first, the standing cap.
      mode:
        description: "Internal: 'fresh' or 'backfill' while draining a backlog; empty for an ordinary run"
        type: string
        default: ""
      # BUNDLE BACKFILL (owner, 2026-09-27; scripts/backfill.py). The switch
      # is data/backfill.json, read by the collector itself; this input only
      # sizes the JOB: a run chained by a run that was in backfill mode gets
      # the long timeout and the long wall-clock budget, so the chain covers
      # the switch's whole span in successive runs. A cron-started run with
      # the switch on backfills for its shorter budget and chains with this
      # set. Passing it by hand on a dispatch is fine; it changes nothing
      # once the switch's `until` has passed.
      bundle_backfill:
        description: "Internal: 'true' while data/backfill.json is in force (long job + long wall-clock budget for the bundle backfill)"
        type: string
        default: ""
  # NO push trigger, deliberately. Every chained run checks out the branch
  # head, so a pipeline change is live within one cadence tick anyway -- and
  # a push-triggered run competes for the single concurrency slot, where the
  # newest PENDING run silently cancels the older one. That is how a code
  # push cancelled the queued full-budget drain twice in one night, and how
  # a chained successor cancelled a manual dispatch. UI pushes were already
  # routed to deploy-site.yml for the same reason. Need a change applied
  # right now? Dispatch this workflow by hand; the watchdog covers the rest.

# One refresh at a time. A run that is still fetching must not have the next
# one start underneath it and fight over the same journals.
concurrency:
  group: wowlogs-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  refresh:
    # Runs on the schedule and on every dispatch: a hand dispatch, the
    # watchdog's revival, a backfill chain's successor (bundle_backfill=true,
    # scripts/backfill.py -- it needs this job's journals, build and deploy).
    # To pause everything again: comment the cron out above AND put
    # `if: false` here (a dispatch that still arrives is then a skipped run
    # that spends nothing), and the same on watchdog.yml's job -- that is
    # exactly how the 2026-09-28 pause was held.
    runs-on: ubuntu-latest
    # 80 for the scheduled path: a 4-hourly run has four hours of new runs to
    # fetch (~1,700, ~15 min with the bundle) and may sit up to 8 min waiting
    # for a quota window before the build, the sidecars and the deploy; the
    # next slot is hours away, so nothing is bled into. A gear refetch needs
    # more than one hourly quota window by arithmetic, so it is allowed to sit
    # through the reset rather than stop and wait to be dispatched again.
    # A bundle-backfill run (see the input) gets 170: it backfills for
    # BACKFILL_WALL_S (2 h, sleeping to the hourly reset inside that when the
    # budget is spent early) and still has ~50 minutes for the build, the
    # deploy, the prune and the cache save before this limit.
    timeout-minutes: ${{ inputs.bundle_backfill == 'true' && 170 || (inputs.regear_min_key != '' || inputs.drain == 'true') && 110 || 80 }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Chained runs exist only while data/backfill.json is in force or an
      # explicitly dispatched drain has a backlog (see the Chain step): a
      # scheduled run is paced by the cron alone, and this step only records
      # JOB_START for it (the backfill's wall clock, the health lines). The
      # branches below pace a drain's successors. Concurrency holds one
      # pending run at most, so a cron tick landing mid-chain self-cancels
      # into it.
      - name: Pace the chain
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          PREV="${{ inputs.prev_start }}"
          if [ "${{ inputs.mode }}" = "fresh" ] || [ "${{ inputs.mode }}" = "backfill" ]; then
            # Alternating drain: never wait. The backfill run left a reserve
            # for the fresh run, and a fresh run's few hundred points are
            # always worth spending the moment they exist.
            echo "drain (${{ inputs.mode }}): starting immediately"
          elif [ "${{ inputs.drain }}" = "true" ]; then
            # A drain successor is paced by the QUOTA WINDOW, not the slot:
            # its predecessor spent the hour, so starting before the reset
            # would only discover an empty budget. Wait for the reset (plus a
            # cushion), capped so the job can never time out asleep.
            RESET="${{ inputs.prev_reset_at }}"
            if [ -n "$RESET" ]; then
              NOW=$(date +%s); WAIT=$(( RESET - NOW + 20 ))
              [ "$WAIT" -gt 2400 ] && WAIT=2400
              if [ "$WAIT" -gt 0 ]; then echo "drain: waiting ${WAIT}s for the quota window"; sleep "$WAIT"; fi
            fi
          elif [ "${{ inputs.chain }}" = "true" ] && [ -n "$PREV" ]; then
            # No pacing (owner, 2026-09-09: "minimum time, maximum
            # frequency"). Was 20 minutes between run starts (2026-09-02);
            # the cadence is now the run's own length, ~12 min, and the
            # budget holds because the sweep is shallow four runs in five
            # (see the Sweep depth step) and the collectors run in the
            # background of the build. The daily commit no longer depends
            # on a clock window -- it commits when the seed is 20 h old.
            echo "chained: starting immediately ($(( $(date +%s) - PREV ))s after the previous start)"
          fi

      # The owner's two knobs (data/cadence.json, scripts/cadence.py):
      # every_hours (the cron's period, informational here) and
      # quota_fraction, which every step that runs a Warcraft Logs client
      # takes as WCL_QUOTA_FRACTION below. A missing or bad file is the
      # defaults (4 h, 0.70), said in the log; never a failed run.
      - name: Cadence
        id: cadence
        run: python3 scripts/cadence.py github-output

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      - run: pip install requests pandas orjson


      # Journals are gitignored, so they ride in the cache. The key rotates
      # every run and restore-keys falls back to the newest previous one,
      # which is how you get a read-write cache out of a write-once store.
      #
      # DO NOT add paths here. actions/cache derives a cache *version* from the
      # path list, and a lookup only matches caches of the same version -- so
      # editing this list silently orphans every cache ever saved and the next
      # run re-seeds from the daily CSV commit, losing everything collected
      # since. That happened once (run 32625724812: restore took 0s, fetch took
      # 9m instead of 30s, 70,246 runs -> 34,312). Anything new that needs to
      # survive between runs goes *inside* data/processed. Since 2026-09-08 the
      # Journal guard below turns an empty restore into a skipped run instead of
      # a saved-back empty cache; a deliberate reset needs fresh_start=true.
      - name: Restore collection journals
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/processed
          key: wowlogs-journals-${{ github.run_id }}
          restore-keys: wowlogs-journals-

      # The restore above never fails the job: on a service error or a missing
      # key it warns and leaves the tree empty. Every step from here to Save is
      # gated on this verdict -- ok or fresh opens them, anything else (missing,
      # or no verdict because the guard itself broke) keeps them shut -- so an
      # empty restore can never be saved back as the newest cache (the
      # 2026-08-23 loss). See scripts/journal_guard.sh.
      - name: Journal guard
        id: guard
        env:
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          FRESH_START: ${{ inputs.fresh_start }}
        run: bash scripts/journal_guard.sh

      # Trinket drain window (owner, 2026-09-08 08:38 UTC: "pause fresh runs,
      # remove all limits and drain as much as you can over the next 3 hours").
      # data/procs_drain.json carries an `until` epoch; while the clock is
      # before it, Fetch is skipped and the collector runs at the whole hourly
      # budget. The file is inert afterwards -- nothing to revert by hand, and
      # the standing cap (data/cadence.json) is back the moment the window
      # closes. Every run re-reads it, so a chained successor needs no input
      # to inherit it.
      - name: Drain mode
        id: drain
        env:
          CADENCE_FRACTION: ${{ steps.cadence.outputs.quota_fraction }}
        run: |
          # outputs go to $GITHUB_OUTPUT (key=value ONLY -- a workflow command
          # in that file is an "Invalid format" error that fails the step, as
          # run 34207028988 found); the notice goes to stdout
          python3 - <<'EOF'
          import json, os, pathlib, time
          standing = os.environ.get("CADENCE_FRACTION") or "0.70"
          p = pathlib.Path("data/procs_drain.json")
          cfg, on = {}, False
          if p.exists():
              try:
                  cfg = json.loads(p.read_text()); on = time.time() < float(cfg.get("until", 0))
              except (ValueError, TypeError):
                  cfg, on = {}, False
          # ended early: the collector drained the whole window in an earlier
          # run of THIS drain (marker carries the window's `until`), so pausing
          # fresh runs any longer would collect nothing -- fetching resumes
          marker = pathlib.Path("data/processed/procs_drain_done")
          ended = on and marker.exists() and marker.read_text().strip() == str(cfg.get("until"))
          if ended:
              on = False
          out = {"until": cfg.get("until", 0),
                 "procs_drain": "true" if on else "false",
                 "fraction": cfg.get("fraction", 1.0) if on else standing,
                 "margin": cfg.get("margin", 20) if on else "400",
                 "budget_pts": cfg.get("budget_pts", 18000) if on else "1500",
                 "budget_s": cfg.get("budget_s", 1200) if on else "480",
                 "pause_fetch": "true" if on and cfg.get("pause_fetch", True) else "false"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          print(" ".join(f"{k}={v}" for k, v in out.items()))
          if on:
              left = (float(cfg["until"]) - time.time()) / 60
              print(f"::notice::trinket drain window active for another {left:.0f} min: fresh runs paused, collector at the full hourly budget")
          elif ended:
              print("::notice::trinket drain ended early: the window was fully collected in an earlier run; fresh runs resumed")
          EOF

      # Sweep depth (owner, 2026-09-09). Deep = every board to its cap, the
      # sweep the Coverage line describes, ~1,900 points; shallow = only where
      # a new run can appear (page 1 of a max-score board, the whole board
      # where score still varies), ~800. Deep at least every 50 minutes, and
      # always inside a drain, so nothing a shallow sweep skips waits longer
      # than the next deep one; the discovery ledger holds it meanwhile.
      - name: Sweep depth
        id: depth
        run: |
          D=shallow
          if [ "${{ inputs.drain }}" = "true" ] || [ -n "${{ inputs.mode }}" ]; then D=deep; fi
          S=data/processed/last_deep_sweep
          if [ ! -f "$S" ] || [ $(( $(date +%s) - $(cat "$S" 2>/dev/null || echo 0) )) -gt 3000 ]; then D=deep; fi
          echo "depth=$D" >> "$GITHUB_OUTPUT"
          echo "sweep depth: $D (last deep: $( [ -f "$S" ] && date -u -d @"$(cat "$S")" +%H:%MZ || echo never ))"

      - name: Fetch
        id: fetch
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh') && steps.drain.outputs.pause_fetch != 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          SWEEP_DEPTH: ${{ steps.depth.outputs.depth }}
          # Hard ceiling on the share of the hourly API budget this run may
          # spend: data/cadence.json's quota_fraction (0.70, owner 2026-09-30),
          # read by the Cadence step. The budget is per ACCOUNT and the client
          # measures the ceiling against the account's live spend, so the
          # remaining 30 % stays free for the owner's own lookups on the same
          # credentials -- and their lookups count against this run. The
          # client refuses to send a request that would cross the ceiling and
          # sleeps (WCL_MAX_SLEEP_S) or stops cleanly instead; a run that
          # starts with the hour already over it never fetches past. The
          # scheduled path never overrides it: `inputs` is empty on a
          # schedule. A manual dispatch may set quota_fraction for a single
          # deliberate run; a drain run (see the input) is capped like any
          # other -- the owner's 70 % holds in every mode (2026-09-30), a
          # drain just keeps chaining until its backlog is gone. The backfill
          # switch overrides the value inside the collector
          # (execution.backfill_mode's share).
          WCL_QUOTA_FRACTION: ${{ inputs.quota_fraction || steps.cadence.outputs.quota_fraction }}
          # the fresh slice: only runs from the last 12 hours, so the run is
          # small and the deploy is minutes away; everything older waits for
          # the backfill run that follows
          FRESH_ARGS: ${{ inputs.mode == 'fresh' && '--fresh-hours 12' || '' }}
          # the gear export (two passes over a multi-GB journal, ~3-4 min) only
          # when something will keep the result: a seed commit or a regear
          EXPORT_GEAR: ${{ (inputs.commit_export == true || inputs.regear_min_key != '') && '1' || '0' }}
          # Scheduled runs never wait more than 8 minutes for a quota window:
          # a run that finds the hour spent (the owner's lookups, say) stops
          # cleanly with what it has, builds and deploys, and the next cron
          # tick sweeps the rest on a fresh window. A refetch has nothing to
          # hand off to, so it waits the window out.
          # A drain run never sleeps for the window: sleeping inside the job
          # buys nothing over stopping at the first ceiling, exporting,
          # deploying and chaining a successor timed to the reset -- and it
          # is how a full-budget run walks into the job timeout with the
          # chain step never reached.
          WCL_MAX_SLEEP_S: ${{ inputs.regear_min_key != '' && '3000' || inputs.drain == 'true' && '60' || '480' }}
          # Headroom the client keeps below the ceiling. Nothing else is
          # competing during a deliberate refetch, so it can run to the line.
          WCL_BUDGET_MARGIN: ${{ (inputs.regear_min_key != '' || inputs.drain == 'true') && '20' || '400' }}
          # BUNDLE BACKFILL: the wall-clock budget, measured from JOB_START
          # (the Pace step), the collector may spend in backfill mode before
          # it stops and lets the run build, deploy, save and chain. 2 h in a
          # run sized for it (170-minute job), 20 min in an ordinary 80-minute
          # run that finds the switch on (it chains a long one). Only read
          # while data/backfill.json is in force; the standing WCL_MAX_SLEEP_S
          # cap above is replaced by this deadline for the same span.
          BACKFILL_WALL_S: ${{ inputs.bundle_backfill == 'true' && '7200' || '1200' }}
          # the collector must know it runs for the backfill: once the
          # switch has expired such a run makes no request at all
          # (fetch_data.main). Run 4288 (16:16 IST) lacked this and went
          # into the normal sweep; only a spent window kept it from spending.
          BUNDLE_BACKFILL: ${{ inputs.bundle_backfill }}
        run: |
          test -n "$WCL_CLIENT_ID" || {
            echo "::error::WCL_CLIENT_ID / WCL_CLIENT_SECRET repository secrets are not set"
            exit 1
          }
          # The sweep closes its cursors once walked, so a refresh that does
          # not re-scan finds nothing -- hence re-scanning by default. A gear
          # refetch works from the existing journal and gains nothing from it,
          # and the scan is ~1,900 points, about 1,400 runs of refetch.
          REGEAR=""
          if [ -n "${{ inputs.regear_min_key }}" ]; then
            REGEAR="--regear-min-key ${{ inputs.regear_min_key }} --regear-days ${{ inputs.regear_days || '3' }}"
            echo "::notice::gear refetch: $REGEAR at quota fraction $WCL_QUOTA_FRACTION"
          fi
          SWEEP="--resweep"
          [ "${{ inputs.resweep }}" = "false" ] && SWEEP=""
          python -u scripts/fetch_data.py $SWEEP $REGEAR $FRESH_ARGS

      # Background collectors (owner, 2026-09-09: "minimum time, maximum
      # frequency"). The trinket beam collector, the keystone clock backfill
      # and the Raider.IO ratings sweep used to run one after another in the
      # foreground -- fifteen minutes of Raider.IO alone -- and the chain
      # waited on all of it. None of them feeds THIS run's build: the build
      # reads the procs journal (its reader tolerates a torn tail), the clock
      # map is consumed by the NEXT run's export, and Raider.IO replaces its
      # file atomically. So they start here, run under the name resolution
      # and the build, and the job only waits for them before the cache save.
      # Budgets: trinket 1,500 pts / 8 min standing (the drain window's
      # fraction inside a drain), keystone 400 reports, Raider.IO 180 s
      # (96.4% of characters are rated; five runs an hour keep it there).
      - name: Start background collectors
        id: bg
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh') && inputs.regear_min_key == ''
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_MAX_SLEEP_S: "30"
          # every collector here runs under the cadence cap (data/cadence.json,
          # the Cadence step) against the account's LIVE spend: what Fetch and
          # the owner already spent this hour is already counted, so the
          # collectors take only what is left under 70 % and stop cleanly
          # (30 s sleep cap) when there is none
          WCL_QUOTA_FRACTION: ${{ steps.cadence.outputs.quota_fraction }}
          # standing: the cadence cap / 400; inside a drain window
          # (data/procs_drain.json) the whole hourly budget with a 20-point
          # margin -- trinket only
          TRINKET_FRACTION: ${{ steps.drain.outputs.fraction }}
          TRINKET_MARGIN: ${{ steps.drain.outputs.margin }}
          TRINKET_PTS: ${{ steps.drain.outputs.budget_pts }}
          TRINKET_S: ${{ steps.drain.outputs.budget_s }}
          IN_DRAIN: ${{ steps.drain.outputs.procs_drain }}
          # a bundle-backfill run leaves every Warcraft Logs point to the
          # backfill: the trinket and keystone collectors sit this run out
          # (Raider.IO spends no WCL points and runs as always)
          BUNDLE_BACKFILL: ${{ inputs.bundle_backfill }}
        run: |
          BG="$RUNNER_TEMP/bg"; mkdir -p "$BG"; echo "dir=$BG" >> "$GITHUB_OUTPUT"
          launch() {   # launch <name> <cmd...>: detached, log + exit code in $BG
            local n="$1"; shift
            setsid nohup bash -c "( $* ); echo \$? > '$BG/$n.rc'" > "$BG/$n.log" 2>&1 < /dev/null &
            echo "started $n (pid $!)"
          }
          if [ "$BUNDLE_BACKFILL" = "true" ]; then
            echo "bundle backfill run: trinket and keystone collectors skipped (every WCL point goes to the backfill)"
          else
          launch trinket "WCL_QUOTA_FRACTION=$TRINKET_FRACTION WCL_BUDGET_MARGIN=$TRINKET_MARGIN python -u scripts/fetch_procs.py --budget-pts $TRINKET_PTS --budget-s $TRINKET_S --since-reset"
          fi
          if [ "$IN_DRAIN" != "true" ] && [ "$BUNDLE_BACKFILL" != "true" ]; then
            # The clock backfill yields to the summaries backlog: while
            # thousands of listed runs are still unfetched after this run's
            # Fetch (summaries.left -- NOT sweep.ledger_only, which counts
            # runs long fetched and sat at 48k on 2026-09-09 against 316
            # actually pending) the fresh data matters more than old
            # fights' clocks.
            LEFT=$(grep '^summaries.left=' data/processed/fetch_health.txt 2>/dev/null | cut -d= -f2)
            KS=400; [ "${LEFT:-0}" -gt 5000 ] 2>/dev/null && KS=150
            echo "keystone backfill: $KS reports this run (summaries still to fetch after this Fetch: ${LEFT:-?})"
            launch keystone python -u scripts/backfill_keystone.py --max-reports $KS
          fi
          RIO=180; [ "$IN_DRAIN" = "true" ] && RIO=60
          launch rio python -u scripts/fetch_rio.py --budget-s "$RIO"

      # Item/enchant/crafted/embellishment names for the builds sidecar.
      # Caches live in data/processed (rides the journal cache between runs)
      # and mirror to the committed data/*.json via the daily commit below —
      # the gear-journal pattern. The cache PATH LIST above must not change.
      # --limit bounds any one run's fetching; the seed spreads across runs.
      - name: Resolve names
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh')
        run: |
          # names_bonus_emb2 is RETIRED but still copied IN for one
          # release: the CI copy holds v2's sticky nulls and the
          # migration in fetch_names.py has to read them once to
          # report how many it dropped. It is never copied back.
          # emb_overrides.json is deliberately NOT round-tripped:
          # it is human-only, so the committed copy is the
          # authority and a cached copy must never shadow an edit.
          for f in names_items names_enchants crafted_ids names_bonus_emb2 emb_identity emb_items names_icons; do
            if [ -f "data/processed/$f.json" ]; then cp "data/processed/$f.json" "data/$f.json"; fi
          done
          python -u scripts/fetch_names.py --limit 2000 || echo "::warning::name fetch failed; building with existing caches"
          for f in names_items names_enchants crafted_ids emb_identity emb_items names_icons; do
            cp "data/$f.json" "data/processed/$f.json" 2>/dev/null || true
          done

      # Spell names/icons for the talent-tree document. The tree GEOMETRY
      # (data/trait_geometry.json) is committed and only rewritten by a
      # manual `fetch_traits.py --refresh` run -- it deliberately does NOT
      # round-trip through the Actions cache, so a stale cache copy can
      # never clobber a newer committed geometry. Spell names are grow-only
      # and ride the cache like the other name caches.
      - name: Resolve talent spells
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh')
        run: |
          if [ -f "data/processed/names_spells.json" ]; then
            cp "data/processed/names_spells.json" "data/names_spells.json"
          fi
          python -u scripts/fetch_traits.py --limit 1200 || echo "::warning::trait fetch failed; building with existing caches"
          cp "data/names_spells.json" "data/processed/names_spells.json" 2>/dev/null || true

      - name: Build site
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh')
        run: |
          python -u scripts/build_site_data.py
          # Baselines + run store for the Key Level Logs site (scripts/
          # build_baselines.py; keylevel_addon design/baselines-from-wowlogs.md):
          # site/baselines.json.gz and site/runs/<hh>.json.gz from the same
          # retention-windowed frame, health lines appended to build_health.txt.
          # A failure here must never stop the dashboard publishing -- the
          # consumer feature-detects the sidecars and works without them.
          python -u scripts/build_baselines.py \
            || echo "::warning::baselines/run-store build failed; site published without them"
          # Embellishment identity has now failed twice in
          # production, both times silently. The verdict token is
          # the first line of the [emb] block; surface it as an
          # ANNOTATION -- a data problem must never stop the site
          # publishing.
          grep -q "\[emb\] verdict: ok" site/build_health.txt \
            || echo "::warning::embellishment identity degraded -- see site/build_health.txt"
          # §7.4 tripwires, surfaced as annotations. The lines are in
          # build_health.txt for the watchdog and for humans; dual-emit's
          # hard stop is either of them on two consecutive days.
          grep -q "^build.wall_tripped=1" site/build_health.txt \
            && echo "::warning::legacy build over the 10-minute tripwire (build.wall_s in build_health.txt)"
          grep -q "^fetch.export.rss_tripped=1\|^fetch.export.wall_tripped=1" site/build_health.txt \
            && echo "::warning::export() over a §7.4 tripwire (fetch.export.* in build_health.txt)"
          true


      # This workflow publishes ITS OWN checkout's site/, so a run that started
      # before a UI push republishes the OLD interface and silently reverts it --
      # which is exactly how the talent-diff UI vanished minutes after deploying.
      # Take the branch's newest committed UI immediately before publishing.
      # ONLY the UI files. The payloads (site/data.json.gz and friends) are
      # gitignored since 2026-09-15 -- a checkout cannot carry a stale one; the
      # committed copy that used to sit here was frozen weeks outside the
      # retention window by construction. The index is reset afterwards so the
      # daily-commit step below cannot sweep the UI into a data commit built on
      # an older base.
      - name: Publish the newest committed UI, not this checkout's
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh')
        continue-on-error: true
        run: |
          git fetch --depth=1 origin "${{ github.ref_name }}" || exit 0
          git checkout FETCH_HEAD -- site/index.html || true
          git checkout FETCH_HEAD -- site/icons || true
          git reset -q
          echo "UI synced to $(git rev-parse --short FETCH_HEAD) (run sha $(git rev-parse --short HEAD))"

      - uses: actions/configure-pages@v5
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh')

      - uses: actions/upload-pages-artifact@v3
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh')
        with:
          path: site

      - id: deploy
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh')
        uses: actions/deploy-pages@v4

      # Runs AFTER the deploy, deliberately. It spends no Warcraft Logs
      # budget, and the build does not need this run's ratings: it reads
      # the journal restored from the cache, so ratings are one run stale,
      # at most 30 minutes, which is well inside what they are worth.
      # Ahead of the deploy its whole budget sat between a push and the
      # site updating -- ~20 minutes to publish a CSS change. Behind it the
      # page is live in about four, and the collector still gets every
      # second of its budget. Save collection journals MUST stay after this
      # step, or the ratings it fetches never reach the cache.

      # Wait for the background collectors before anything reads or saves
      # their journals. Normally they finished under the build; inside a
      # drain window the trinket collector may hold the full 20 minutes.
      - name: Wait for background collectors
        if: always() && steps.bg.outcome == 'success'
        env:
          IN_DRAIN: ${{ steps.drain.outputs.procs_drain }}
          UNTIL: ${{ steps.drain.outputs.until }}
        run: |
          BG="${{ steps.bg.outputs.dir }}"; T0=$(date +%s)
          for n in trinket keystone rio; do
            [ -f "$BG/$n.log" ] || continue
            while [ ! -f "$BG/$n.rc" ] && [ $(( $(date +%s) - T0 )) -lt 1500 ]; do sleep 3; done
            RC=$(cat "$BG/$n.rc" 2>/dev/null || echo "still running after 25 min")
            echo "::group::$n (exit $RC, waited $(( $(date +%s) - T0 ))s)"; tail -n 40 "$BG/$n.log"; echo "::endgroup::"
            [ "$RC" = "0" ] || echo "::warning::background collector $n ended with '$RC'; building with the existing journal"
          done
          # Inside a drain window: when the trinket collector stopped because it
          # ran OUT OF WORK (no "stopped=" reason in its last fetch_health
          # block), the window is drained -- leave a marker so the next run's
          # Drain mode ends the drain and fresh runs resume.
          if [ "$IN_DRAIN" = "true" ] && [ -f data/processed/fetch_health.txt ]; then
            LAST=$(awk '/^procs\.lscore\.total=/{blk=""} {blk=blk $0 "\n"} END{printf "%s", blk}' data/processed/fetch_health.txt)
            if echo "$LAST" | grep -q "^procs\.lscore\.ok=" && ! echo "$LAST" | grep -q "^procs\.lscore\.stopped="; then
              echo "$UNTIL" > data/processed/procs_drain_done
              echo "::notice::drain: the one-reset window is fully collected; the drain ends here and fresh runs resume on the next run"
            fi
          fi

      # RETENTION (owner, 2026-09-14): disk keeps RETENTION_DISK_DAYS (16)
      # measured from the newest row on disk -- strictly wider than the page's
      # window (2 resets, 15-day ceiling), see scripts/retention.py. Runs HERE,
      # after the background collectors have joined and after this run's build
      # already read its CSV, so nothing holds a journal open and a prune can
      # never starve the build that publishes in the same run. Gated on 'ok'
      # only (never 'fresh': a cold start has nothing on disk to prune, and a
      # refusal there would look like a finding). The pruner's first ever
      # invocation is a dry run; afterwards it applies at most every 20 h
      # (data/processed/prune_state.json), touches journals BY NAME, deletes
      # only on proof of age, rewrites atomically and leaves a journal with
      # nothing to drop untouched. summaries_done.txt is exempt.
      - name: Prune the journals to the retention window
        if: always() && steps.guard.outputs.journals == 'ok' && steps.fetch.outcome == 'success'
        run: |
          python -u scripts/prune_journals.py
          [ -f data/processed/retention.txt ] && sed 's/^/  retention: /' data/processed/retention.txt || true

      - name: Save collection journals
        # always() so a failed Fetch still saves what it journaled -- but NEVER
        # after a tripped guard, which is the whole point of the guard
        if: always() && (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh')
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/processed
          key: wowlogs-journals-${{ github.run_id }}


      # Keeps the recovery seed fresh at one commit a day instead of forty-eight.
      # Chained runs are workflow_dispatch events, so an event-name gate alone
      # skipped this step on every run from the day self-chaining landed
      # (Aug 27) until it was noticed: the recovery seed sat at Aug 26 for a
      # week. The 02:00-02:29 window below still limits it to once a day.
      - name: Commit the export (daily)
        if: (steps.guard.outputs.journals == 'ok' || steps.guard.outputs.journals == 'fresh') && (github.event_name == 'schedule' || inputs.chain == 'true' || inputs.commit_export == true)
        run: |
          # A manual dispatch that asks for it commits immediately and takes
          # the gear journal with it, whatever day it is. Without this the
          # weekly slot is the only way in, so a week's gear sits uncommitted
          # purely because the code landed after Monday's slot had run.
          FORCE="${{ inputs.commit_export == true && '1' || '' }}"
          # Match the 02:00 run, and accept it in the 03:00 hour too: GitHub
          # runs scheduled jobs late under load, and an hour-exact gate means a
          # slipped run silently skips the day's seed. The 04:00 run cannot
          # reach back into 03, so at most one run a day still matches.
          #
          # This gate MUST agree with the chain pacing above. Runs start 20
          # minutes apart, so a 20-minute window matched against the commit
          # step's own clock admits exactly one run a day: the one that
          # reaches this step between 02:00 and 02:19. If a slow run slips
          # past the window the seed just waits a day -- the owner
          # explicitly does not mind.
          # Self-heal: a manual commit_export dispatch is routinely cancelled by
          # the chain's own successor dispatch (newest pending run wins the
          # single concurrency slot), and a slipped slot waits a day. So the
          # seed also commits whenever the committed CSV is older than 20 h,
          # judged by the API (the checkout is shallow; git log would lie).
          if [ -z "$FORCE" ]; then
            SEED_TS=$(curl -sf -m 15 -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits?path=data/mythic_runs.csv.gz&sha=${{ github.ref_name }}&per_page=1" \
              | jq -r '.[0].commit.committer.date // empty' || true)
            SEED_AGE_H=-1
            if [ -n "$SEED_TS" ]; then SEED_AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$SEED_TS" +%s) ) / 3600 )); fi
            echo "committed seed age: ${SEED_AGE_H} h (${SEED_TS:-unknown})"
            # 2026-09-09: the clock slot is gone with the pacing (runs are
            # ~12 min apart, so a 20-minute slot would admit two). The seed
            # commits exactly when the committed copy is 20 h old; an
            # unknown age (API hiccup) waits for the next run rather than
            # committing every run.
            if [ "$SEED_AGE_H" -ge 20 ] 2>/dev/null; then
              echo "seed older than 20 h -> committing"
            else
              echo "seed is ${SEED_AGE_H} h old (or unknown); skipping"; exit 0
            fi
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -f data/processed/rio_scores.csv.gz data/rio_scores.csv.gz 2>/dev/null || true
          # RETENTION: the committed CSV now holds only the window (export()),
          # so a cold start can no longer rebuild the FULL done-set from it.
          # The done-set itself (summaries_done.txt, exempt from the prune, a
          # few MB gzipped) is committed daily under data/checkpoints/, the
          # path restore_checkpoints() has always read: a cold start then knows
          # every run it ever fetched and re-buys nothing.
          if [ -s data/processed/summaries_done.txt ]; then
            mkdir -p data/checkpoints
            gzip -9 -c data/processed/summaries_done.txt > data/checkpoints/summaries_done.txt.gz.tmp \
              && mv -f data/checkpoints/summaries_done.txt.gz.tmp data/checkpoints/summaries_done.txt.gz
            git add data/checkpoints/summaries_done.txt.gz
          fi
          # Seed floor: never overwrite the committed seed with a CSV that is
          # implausibly small (a torn journal, a prune gone wrong). The window
          # holds ~800k rows today; a seed under the floor is skipped and said.
          ROWS=$(grep '^export.rows=' data/processed/fetch_health.txt 2>/dev/null | tail -1 | cut -d= -f2)
          SEED_FLOOR=200000
          # GitHub rejects any file over 100 MB at push, and a rejected push
          # fails this step and the run. Nothing over 95 MB is ever staged;
          # a skipped file is a loud warning, not a red run. The gear journal
          # is already past the limit and the CSV crosses it around the end
          # of September -- durable copies are moving to Release assets.
          too_big() { [ -f "$1" ] && [ "$(stat -c %s "$1")" -gt 99614720 ]; }
          if too_big data/mythic_runs.csv.gz; then
            echo "::warning::mythic_runs.csv.gz is $(du -h data/mythic_runs.csv.gz | cut -f1), over GitHub's 100 MB file limit; NOT committed"
            git add data/keystone_times.json data/rio_scores.csv.gz
          elif [ -n "$ROWS" ] && [ "$ROWS" -lt "$SEED_FLOOR" ] 2>/dev/null; then
            echo "::warning::export wrote only ${ROWS} rows (floor ${SEED_FLOOR}); the committed seed is NOT overwritten this run -- check the prune (data/processed/prune_state.json) and the journal before the next daily commit"
            git checkout -- data/mythic_runs.csv.gz 2>/dev/null || true
            git add data/keystone_times.json data/rio_scores.csv.gz
          else
            git add data/mythic_runs.csv.gz data/keystone_times.json data/rio_scores.csv.gz
          fi
          git add data/names_items.json data/names_enchants.json data/crafted_ids.json data/emb_markers.json 2>/dev/null || true
          git add data/emb_identity.json data/emb_items.json data/emb_overrides.json 2>/dev/null || true
          git add data/names_icons.json data/names_spells.json data/trait_geometry.json 2>/dev/null || true
          # icon images sync_icons copied into site/ this run (grow-only, tiny)
          git add site/icons 2>/dev/null || true
          # The gear/talent journal is an order of magnitude bigger than the
          # rest (53 MB and climbing) and git keeps every version forever, so
          # it rides once a week rather than daily. Monday is the first daily
          # slot after the weekly reset. Losing it would cost the per-item
          # detail -- trinkets, gems, enchants, talents -- permanently, since
          # summaries cannot be refetched once a run leaves the leaderboard;
          # the site's rankings would be unaffected, because they need
          # only mythic_runs.csv.gz.
          if { [ "$(date -u +%u)" = "1" ] || [ -n "$FORCE" ]; } && [ -f data/gear.jsonl.gz ]; then
            if too_big data/gear.jsonl.gz; then
              echo "::warning::gear.jsonl.gz is $(du -h data/gear.jsonl.gz | cut -f1), over GitHub's 100 MB file limit; NOT committed (it has never fit -- Release assets are its home)"
            else
              echo "Monday: including the gear journal ($(du -h data/gear.jsonl.gz | cut -f1))"
              git add data/gear.jsonl.gz
            fi
          fi
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Daily data export ($(date -u +%Y-%m-%d))"
          # The branch may have moved since this run's checkout -- a code push
          # landing mid-run is routine -- and a plain push is then rejected as
          # non-fast-forward, which fails the run, and a failed run does not
          # chain (2026-09-06: that ended a drain, and the watchdog revived it
          # as a plain standing-cap run). The export touches only data files that no
          # code commit edits, so replaying it onto the new tip is safe; if
          # the rebase somehow conflicts, give up on THIS commit loudly and
          # let the 20-hour seed rule retry next run rather than fail the run.
          # --filter=blob:none: the deepen used to pull every daily seed blob in
          # the last 50 commits (~390 MB) to replay one commit; commits and trees
          # still arrive, so the merge base is still found. --no-tags: a future
          # Release tag must not drag its history back in. Guarded: a failed
          # deepen used to fail the job and break the chain.
          if ! git fetch --filter=blob:none --no-tags --depth=50 origin "${{ github.ref_name }}"; then
            echo "::warning::could not deepen the branch to replay the export commit; skipped (the seed rule retries next run)"
            exit 0
          fi
          if ! git -c rebase.autoStash=true rebase FETCH_HEAD; then
            git rebase --abort || true
            echo "::warning::export commit could not be replayed onto the moved branch tip; skipped (the seed rule retries next run)"
            exit 0
          fi
          git push origin HEAD:${{ github.ref_name }}

      # Chain the next run -- ONLY while something other than the cadence is
      # driving: data/backfill.json in force (the successor is a long
      # backfill run, so the chain covers the switch's whole span back to
      # back), or an explicitly dispatched drain with a backlog (its
      # fresh/backfill alternation). In cadence mode -- a scheduled run, a
      # hand dispatch, the watchdog's revival -- a run dispatches NOTHING:
      # the cron is the cadence (data/cadence.json every_hours), and a
      # self-chain here would double the spend against the owner's 70 % cap.
      # The decision is scripts/cadence.py chain_decision (tested in
      # scripts/test_cadence.py). Failures deliberately do not chain -- the
      # cron and the watchdog revive the cadence instead of a tight failure
      # loop. When Fetch did not run (a tripped journal guard, a paused
      # Fetch) BACKFILL_ON is empty and the decision consults the switch file
      # itself, so a backfill chain survives a run that could not fetch.
      - name: Chain the next run
        if: success()
        env:
          BACKLOG: ${{ steps.fetch.outputs.backlog }}
          RESET_AT: ${{ steps.fetch.outputs.quota_reset_at }}
          # 1 while data/backfill.json was in force for this run's collector
          # (fetch_health backfill.on): the successor is sized for a backfill
          BACKFILL_ON: ${{ steps.fetch.outputs.backfill_on }}
          DRAIN: ${{ inputs.drain }}
          MODE: ${{ inputs.mode }}
          EVERY_HOURS: ${{ steps.cadence.outputs.every_hours }}
        run: |
          # A FRESH drain run cannot judge the backlog: its sweep and its
          # pending set are the 12-hour slice, so the number it reports is
          # the slice's remainder, not the season's (2026-09-06: a fresh run
          # said 490 while the backfill run that followed fetched for ten
          # minutes). So a fresh run always chains a backfill run, and only
          # a backfill (or plain drain) run, which sees the whole pending
          # set, decides whether draining continues -- see chain_decision.
          eval "$(python3 scripts/cadence.py chain)"
          echo "$REASON"
          if [ "$CHAIN" != "true" ]; then
            echo "no successor dispatched: the cron runs the next refresh (every ${EVERY_HOURS:-4} h, data/cadence.json)"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/refresh.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"chain\":\"true\",\"prev_start\":\"$JOB_START\",\"drain\":\"$NEXT_DRAIN\",\"mode\":\"$NEXT_MODE\",\"prev_reset_at\":\"${RESET_AT:-}\",\"bundle_backfill\":\"$NEXT_BACKFILL\"}}" \
            && echo "chained the next run" || echo "chain dispatch failed; the cron dead-man will revive the cadence"

      # A failed run does not chain (a deterministic fault would loop), but it
      # must not go quiet either: it wakes the watchdog directly, which
      # evaluates the outcome, revives the cadence if nothing else is running
      # and opens the alert on a streak. This path does not depend on either
      # cron firing, which is the point -- GitHub delays scheduled workflows
      # under load and a freshly added schedule can take hours to start.
      - name: Wake the watchdog on failure
        if: failure()
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/watchdog.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}" \
            && echo "watchdog dispatched" || echo "::warning::could not dispatch the watchdog"
