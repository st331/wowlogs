name: Refresh Season 2 data

# Collection sidecar, every 10 minutes. Sweeps the Warcraft Logs leaderboards, fetches
# the summaries for whatever is new, rebuilds the dashboard and publishes it.
#
# Nothing is committed on the hourly path: the built site is 29 MB and a
# commit every hour would add ~3.5 GB a month to the repository. The site is
# published straight from the run as a Pages artifact instead, and the
# journals that make the sweep incremental live in the Actions cache.
# The CSV export IS committed once a day, so a cache eviction costs at most a
# day of re-fetching rather than the whole season (see seed_from_csv()).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      resweep:
        description: "Re-scan the leaderboards (off = only fetch known-missing summaries)"
        type: boolean
        default: true
  push:
    branches: [claude/wow-mythic-dashboard-jv235l]
    paths:
      - "site/**"
      - "scripts/**"
      - "data/tuning_patches.json"
      - ".github/workflows/refresh.yml"

# One refresh at a time. A run that is still fetching must not have the next
# hour's run start underneath it and fight over the same journals.
concurrency:
  group: wowlogs-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50          # never let a run bleed into the next hour
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install requests pandas

      # Journals are gitignored, so they ride in the cache. The key rotates
      # every run and restore-keys falls back to the newest previous one,
      # which is how you get a read-write cache out of a write-once store.
      - name: Restore collection journals
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/processed
            data/rio_scores.csv.gz
          key: wowlogs-journals-${{ github.run_id }}
          restore-keys: wowlogs-journals-

      - name: Fetch
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          # the job has 50 minutes; never spend more than 8 of them asleep
          # waiting for a quota window that the next run will get for free
          WCL_MAX_SLEEP_S: "480"
        run: |
          test -n "$WCL_CLIENT_ID" || {
            echo "::error::WCL_CLIENT_ID / WCL_CLIENT_SECRET repository secrets are not set"
            exit 1
          }
          # On a scheduled run always re-scan; the sweep considers itself
          # finished once its cursors close, so without this it finds nothing.
          # the rankings sweep closes its cursors once walked, so a refresh
          # that does not re-scan finds nothing
          python -u scripts/fetch_data.py --resweep

      # Raider.IO season scores, one request per character against a ~150k
      # population and no bulk endpoint. Time-boxed so it never crowds the job:
      # four minutes a run at ~300/min fills the backlog over about a day, then
      # costs a couple of minutes an hour to keep the week-old entries fresh.
      # Never fails the run -- an enrichment outage must not stop the refresh.
      - name: Raider.IO player ratings
        continue-on-error: true
        run: python -u scripts/fetch_rio.py --budget-s 240

      - name: Build site
        run: python -u scripts/build_site_data.py

      - name: Save collection journals
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/processed
            data/rio_scores.csv.gz
          key: wowlogs-journals-${{ github.run_id }}

      # Keeps the recovery seed fresh at one commit a day instead of 24.
      - name: Commit the export (daily)
        if: github.event_name == 'schedule'
        run: |
          # six runs an hour now, so pin the daily commit to ONE of them --
          # otherwise every run in the 03:00 hour races to push the same file
          [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 10 ] \
            || { echo "not the daily slot; skipping"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mythic_runs.csv.gz data/keystone_times.json data/rio_scores.csv.gz
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Daily data export ($(date -u +%Y-%m-%d))"
          git push origin HEAD:${{ github.ref_name }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
