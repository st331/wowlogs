name: Deploy site (UI only)

# Push-to-live for UI changes in seconds, not minutes. The refresh pipeline
# rebuilds data before it can publish and queues behind its own schedule; a
# CSS tweak does not need any of that. This workflow takes the newest Pages
# artifact the refresh pipeline published (the data files exactly as they are
# live right now), overlays the freshly pushed site/ on top, and redeploys.
# No python, no API fetch, no cache, no lock shared with the data pipeline.
on:
  push:
    branches: [claude/wow-mythic-dashboard-jv235l]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

# Its own group, and newest wins: a burst of UI pushes collapses to the last
# one. Never shares the wowlogs-refresh group -- that lock is the main reason
# UI deploys used to take up to 20 minutes.
concurrency:
  group: wowlogs-site-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read        # to download the refresh pipeline's Pages artifact
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
          sparse-checkout-cone-mode: true

      - name: Overlay pushed UI onto the live data
        id: overlay
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/live /tmp/out
          # Everything a refresh run generates into site/ (the UI files are
          # git-tracked and come from the checkout below instead): the
          # dashboard payloads, the Key Level Logs sidecar -- baselines.json.gz
          # and the 256 run-store shards runs/00..ff.json.gz that site's Key
          # fit reads -- and build_health.txt, which the watchdog reads for
          # recency. Seeding only the five payloads (2026-09-30 11:59 IST,
          # run 90) dropped the shards and the health file from the live site
          # until the next refresh republished them. A file the live site
          # does not have is skipped, never published empty -- and REMOVED
          # from the seed if the artifact carried it.
          #
          # THE PAYLOAD HAS TWO FORMS. build_site_data.py ships it gzipped
          # (data.json.gz) above 8 MB and plain (data.json) below, deleting
          # the other; the page asks for the .gz first. Under the two-reset
          # retention it is plain in the first days of every reset (6.4 MB on
          # 2026-11-26). This workflow knew only the .gz: its last check
          # failed on a plain payload, so a UI push did not deploy until the
          # next refresh, and nothing guarded the build stamps. Both forms are
          # handled everywhere below, and only ONE may be published -- a stale
          # .gz beside a fresh plain file would be the one the page reads.
          payload_built() {   # the "built" stamp of a payload file of either form; "" when unreadable
            python3 -c 'import sys,gzip,json; raw=open(sys.argv[1],"rb").read(); print(json.loads(gzip.decompress(raw) if raw[:2]==b"\x1f\x8b" else raw).get("built",""))' "$1" 2>/dev/null || echo ""
          }
          seed_live() {
            mkdir -p /tmp/out/runs
            {
              for f in data.json.gz data.json stats.json.gz builds.json.gz talents.json.gz \
                       baselines.json.gz build_health.txt; do echo "$f"; done
              for i in $(seq 0 255); do printf 'runs/%02x.json.gz\n' "$i"; done
            } | xargs -P 16 -I{} sh -c \
              'curl -sfL -o "/tmp/out/{}" "https://st331.github.io/wowlogs/{}" || rm -f "/tmp/out/{}"'
            echo "  $1: $(ls /tmp/out/*.json.gz /tmp/out/data.json 2>/dev/null | wc -l) payloads," \
                 "$(ls /tmp/out/runs 2>/dev/null | wc -l)/256 run shards," \
                 "build_health.txt $([ -s /tmp/out/build_health.txt ] && echo present || echo missing)"
          }
          # The artifact must come from the REFRESH pipeline's latest
          # successful run -- never "newest artifact by name". This workflow
          # publishes an artifact under the same name, so "newest" can be our
          # own previous deploy; seeding from it would compound whatever it
          # carried instead of tracking the data pipeline. That exact loop
          # served 33-hour-old data once. Walk recent successes in case the
          # newest run's artifact has aged past its 1-day retention. A lookup
          # that fails outright (the API call errors) leaves $url empty and
          # takes the live-seed fallback below, with its warning: it used to
          # abort the step before reaching it.
          url=$(curl -sf -H "Authorization: Bearer $GH_TOKEN"                 "$API/actions/workflows/refresh.yml/runs?status=success&per_page=5"             | python3 -c '
          import sys, json, urllib.request, os
          runs = json.load(sys.stdin).get("workflow_runs", [])
          tok = os.environ["GH_TOKEN"]; api = os.environ["API"]
          # stderr says what the lookup saw, so an empty result explains
          # itself in the log instead of silently taking the fallback
          print("refresh runs seen: %d" % len(runs), file=sys.stderr)
          for r in runs:
              req = urllib.request.Request(
                  api + "/actions/runs/%s/artifacts?name=github-pages" % r["id"],
                  headers={"Authorization": "Bearer " + tok})
              try:
                  arts = json.load(urllib.request.urlopen(req)).get("artifacts", [])
              except Exception as e:
                  print("  run %s: artifacts lookup failed: %s" % (r["id"], e), file=sys.stderr)
                  continue
              live = [a for a in arts if not a["expired"]]
              print("  run %s (#%s): %d artifact(s), %d live" % (r["id"], r.get("run_number"), len(arts), len(live)), file=sys.stderr)
              if live:
                  print(live[0]["archive_download_url"]); break' || true)
          if [ -n "$url" ]; then
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/pages.zip "$url"
            unzip -q /tmp/pages.zip -d /tmp/live
            tar -xf /tmp/live/artifact.tar -C /tmp/out
            echo "seeded from refresh pipeline artifact: $(du -sh /tmp/out | cut -f1)"
          else
            # 2026-09-30: the artifact lookup came back empty although the
            # refresh runs' artifacts existed (run 36675572880), and the `ls`
            # guard below then failed the deploy rather than publish a site
            # with no data -- correct, but it left a shipped UI unpublished.
            # Seed from what is LIVE instead: the same files the older-data
            # branch below keeps, so the UI ships and the data cannot move
            # backwards. The checkout's own data files are never used.
            echo "::warning::no live refresh artifact found; seeding the data files from the live site"
            seed_live "seeded live"
          fi
          # NEVER PUBLISH OLDER DATA THAN IS ALREADY LIVE. "Latest SUCCESSFUL
          # refresh run" excludes a run that is still finishing -- so a UI push
          # landing minutes after that run published its data seeds from the
          # run BEFORE it and silently rolls the dataset backwards. That is not
          # hypothetical: on 2026-08-30 a UI restore reverted the live data from
          # the 05:53 build to the 05:14 one, taking a shipped fix with it.
          # Compare build stamps and keep whichever data is newer; the UI
          # overlay below is applied either way, so the UI still ships.
          live_built=""; art_built=""
          for f in data.json.gz data.json; do     # the form the page would read first
            if curl -sfL -o /tmp/live_payload "https://st331.github.io/wowlogs/$f"; then
              live_built=$(payload_built /tmp/live_payload); break
            fi
          done
          for f in data.json.gz data.json; do
            if [ -s "/tmp/out/$f" ]; then art_built=$(payload_built "/tmp/out/$f"); break; fi
          done
          echo "data build stamps -- live: '${live_built}' artifact: '${art_built}'"
          if [ -n "$live_built" ] && [ -n "$art_built" ] \
             && [ "$art_built" \< "$live_built" ]; then
            echo "::warning::artifact data (${art_built}) is OLDER than live (${live_built}); keeping the live data files"
            seed_live "kept live"
          elif [ -n "$live_built" ] && [ -z "$art_built" ]; then
            echo "::warning::the artifact carries no readable payload; keeping the live data files (${live_built})"
            seed_live "kept live"
          fi
          # Overlay ONLY the UI. Every generated data file is git-tracked and
          # therefore present in the checkout as a stale copy -- a plain cp of
          # site/. once rolled the live dataset back 33 hours. The build
          # products stay whatever the artifact carried.
          tar -C site \
              --exclude='./data.json' --exclude='./data.json.gz' \
              -cf - . | tar -xf - -C /tmp/out
          ls -la /tmp/out/index.html
          # one payload, of either form, or nothing is published
          if [ -s /tmp/out/data.json.gz ] && [ -s /tmp/out/data.json ]; then
            echo "::error::both data.json.gz and data.json are in the site to publish; the page would read the .gz whichever is newer"; exit 1
          fi
          if [ ! -s /tmp/out/data.json.gz ] && [ ! -s /tmp/out/data.json ]; then
            echo "::error::no payload (data.json.gz or data.json) in the site to publish"; exit 1
          fi
          ls -la /tmp/out/data.json*

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/out
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # 2026-11-26: deploy-pages asked for the artifact a quarter of a second
      # after the upload step had finalized it, GitHub listed "0 artifact(s)",
      # and the deploy failed: twice in the UI deploy and three times in the
      # refresh pipeline within 75 minutes. Nothing was wrong with any of the
      # artifacts. One more attempt after a pause; if that fails too, the job
      # fails as it did before.
      - name: Pause before a second deploy attempt
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
