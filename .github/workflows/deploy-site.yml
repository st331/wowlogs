name: Deploy site (UI only)

# Push-to-live for UI changes in seconds, not minutes. The refresh pipeline
# rebuilds data before it can publish and queues behind its own schedule; a
# CSS tweak does not need any of that. This workflow takes the newest Pages
# artifact the refresh pipeline published (the data files exactly as they are
# live right now), overlays the freshly pushed site/ on top, and redeploys.
# No python, no API fetch, no cache, no lock shared with the data pipeline.
on:
  push:
    branches: [claude/wow-mythic-dashboard-jv235l]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

# Its own group, and newest wins: a burst of UI pushes collapses to the last
# one. Never shares the wowlogs-refresh group -- that lock is the main reason
# UI deploys used to take up to 20 minutes.
concurrency:
  group: wowlogs-site-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read        # to download the refresh pipeline's Pages artifact
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
          sparse-checkout-cone-mode: true

      - name: Overlay pushed UI onto the live data
        id: overlay
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/live /tmp/out
          # The artifact must come from the REFRESH pipeline's latest
          # successful run -- never "newest artifact by name". This workflow
          # publishes an artifact under the same name, so "newest" can be our
          # own previous deploy; seeding from it would compound whatever it
          # carried instead of tracking the data pipeline. That exact loop
          # served 33-hour-old data once. Walk recent successes in case the
          # newest run's artifact has aged past its 1-day retention.
          url=$(curl -sf -H "Authorization: Bearer $GH_TOKEN"                 "$API/actions/workflows/refresh.yml/runs?status=success&per_page=5"             | python3 -c '
          import sys, json, urllib.request, os
          runs = json.load(sys.stdin).get("workflow_runs", [])
          tok = os.environ["GH_TOKEN"]; api = os.environ["API"]
          for r in runs:
              req = urllib.request.Request(
                  f"{api}/actions/runs/{r["id"]}/artifacts?name=github-pages",
                  headers={"Authorization": f"Bearer {tok}"})
              arts = json.load(urllib.request.urlopen(req)).get("artifacts", [])
              live = [a for a in arts if not a["expired"]]
              if live:
                  print(live[0]["archive_download_url"]); break')
          if [ -n "$url" ]; then
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/pages.zip "$url"
            unzip -q /tmp/pages.zip -d /tmp/live
            tar -xf /tmp/live/artifact.tar -C /tmp/out
            echo "seeded from refresh pipeline artifact: $(du -sh /tmp/out | cut -f1)"
          else
            echo "::warning::no live refresh artifact; deploying committed files only"
          fi
          # NEVER PUBLISH OLDER DATA THAN IS ALREADY LIVE. "Latest SUCCESSFUL
          # refresh run" excludes a run that is still finishing -- so a UI push
          # landing minutes after that run published its data seeds from the
          # run BEFORE it and silently rolls the dataset backwards. That is not
          # hypothetical: on 2026-08-30 a UI restore reverted the live data from
          # the 05:53 build to the 05:14 one, taking a shipped fix with it.
          # Compare build stamps and keep whichever data is newer; the UI
          # overlay below is applied either way, so the UI still ships.
          live_built=$(curl -sfL "https://st331.github.io/wowlogs/data.json.gz" \
            | python3 -c 'import sys,gzip,json; print(json.load(gzip.open(sys.stdin.buffer)).get("built",""))' 2>/dev/null || echo "")
          art_built=$(python3 -c 'import gzip,json; print(json.load(gzip.open("/tmp/out/data.json.gz")).get("built",""))' 2>/dev/null || echo "")
          echo "data build stamps -- live: '${live_built}' artifact: '${art_built}'"
          if [ -n "$live_built" ] && [ -n "$art_built" ] \
             && [ "$art_built" \< "$live_built" ]; then
            echo "::warning::artifact data (${art_built}) is OLDER than live (${live_built}); keeping the live data files"
            for f in data.json.gz stats.json.gz builds.json.gz talents.json.gz; do
              curl -sfL -o "/tmp/out/$f" "https://st331.github.io/wowlogs/$f" \
                && echo "  kept live $f" || rm -f "/tmp/out/$f"
            done
          fi
          # Overlay ONLY the UI. Every generated data file is git-tracked and
          # therefore present in the checkout as a stale copy -- a plain cp of
          # site/. once rolled the live dataset back 33 hours. The build
          # products stay whatever the artifact carried.
          tar -C site \
              --exclude='./data.json' --exclude='./data.json.gz' \
              --exclude='./llms' --exclude='./llms.txt' \
              --exclude='./sitemap.xml' --exclude='./robots.txt' \
              --exclude='./d' \
              -cf - . | tar -xf - -C /tmp/out
          ls -la /tmp/out/index.html /tmp/out/data.json.gz

      # The partitioned data path (partitioned_payload.md §10 PR-1): site/d/
      # is gitignored and travels in the Pages artifact only, so the same
      # older-than-live trap exists for it -- an artifact seeded from the
      # run BEFORE the newest refresh would roll d/<slug>/ backwards. The
      # generation is manifest.seq (strictly increasing), not a timestamp.
      # When the live manifest is newer, keep the live tree: fetch the live
      # manifest plus ONLY the files it names that the artifact lacks (every
      # file but the manifest is content-hashed and immutable, so anything
      # already present is byte-identical), and write current.json +
      # manifest.json LAST, immediately before upload, so no manifest ever
      # names a file the artifact does not carry.
      - name: Keep the live partitioned data at least as new as the artifact's
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys, urllib.request
          LIVE = "https://st331.github.io/wowlogs/"
          out = pathlib.Path("/tmp/out/d")

          def get(rel):
              try:
                  with urllib.request.urlopen(LIVE + rel, timeout=20) as r:
                      return r.read()
              except Exception as e:                       # noqa: BLE001
                  print(f"  live {rel}: {e}")
                  return None

          cur_raw = get("d/current.json")
          if cur_raw is None:
              print("no live d/current.json; the artifact's d/ stands")
              sys.exit(0)
          cur = json.loads(cur_raw)
          slug = cur["slug"]
          man_raw = get("d/" + cur["manifest"])
          if man_raw is None:
              print("live manifest unreadable; the artifact's d/ stands")
              sys.exit(0)
          live = json.loads(man_raw)
          art_p = out / cur["manifest"]
          art_seq = json.loads(art_p.read_text())["seq"] if art_p.exists() else -1
          print(f"partition manifest seq -- live: {live['seq']} artifact: {art_seq}")
          if art_seq >= live["seq"]:
              sys.exit(0)
          print(f"::warning::artifact d/{slug} (seq {art_seq}) is OLDER than live (seq {live['seq']}); keeping the live partitioned data")
          names = set()
          for e in live.get("days", []):
              if e.get("f"):
                  names.add(e["f"])
              names.update((e.get("specs") or {}).values())
          for w in live.get("weeks", []):
              names.update((w.get("f") or {}).values())
          for k in ("spec_vocab", "specstats", "talents"):
              if live.get(k) and live[k].get("f"):
                  names.add(live[k]["f"])
          cs = live.get("charscore") or {}
          if cs.get("f"):
              names.add(cs["f"])
          if (cs.get("delta") or {}).get("f"):
              names.add(cs["delta"]["f"])
          fetched = missing = 0
          for rel in sorted(names):
              p = out / slug / rel
              if p.exists():
                  continue
              b = get(f"d/{slug}/{rel}")
              if b is None:
                  missing += 1
                  continue
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(b)
              fetched += 1
          if missing:
              print(f"::warning::{missing} live partition files could not be fetched; keeping the artifact's manifest")
              sys.exit(0)
          (out / slug).mkdir(parents=True, exist_ok=True)
          (out / slug / "manifest.json").write_bytes(man_raw)
          (out / "current.json").write_bytes(cur_raw)
          print(f"kept live d/{slug} seq {live['seq']}: {fetched} files fetched, {len(names) - fetched} already present")
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/out
      - id: deploy
        uses: actions/deploy-pages@v4
